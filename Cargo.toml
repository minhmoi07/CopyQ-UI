[package]
name = "copyq-ui"
version = "0.1.0"
edition = "2021"
description = "Lightweight, secure GTK4 popup UI for CopyQ on Linux Mint Cinnamon"
license = "MIT"

# Security-by-design: chỉ dùng thư viện đồ họa cục bộ chính chủ (GTK4 + X11).
# Không thư viện mạng, không telemetry, không gọi shell, không ghi clipboard ra đĩa.
[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
gdk4-x11 = "0.9"
x11rb = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
