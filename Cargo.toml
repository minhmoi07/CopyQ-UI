[package]
name = "copyq-ui"
version = "0.1.0"
edition = "2021"
description = "Lightweight, native GTK3 popup UI for CopyQ on Linux Mint Cinnamon"
license = "MIT"

# Security-by-design: chỉ đúng 1 thư viện duy nhất (GTK3 bản địa của Linux Mint Cinnamon).
# Không thư viện mạng, không telemetry, không gọi shell, không ghi clipboard ra đĩa.
[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
